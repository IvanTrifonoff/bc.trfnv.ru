server {
    listen 80;
    listen [::]:80;
    server_name bc.trfnv.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bc.trfnv.ru;

    ssl_certificate /etc/letsencrypt/live/bc.trfnv.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bc.trfnv.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Оболочку PWA и service worker не кэшируем на прокси — иначе обновления не подхватятся.
    location ~* \.(html|sw\.js)$ {
        proxy_pass http://127.0.0.1:6031;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:6031;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
